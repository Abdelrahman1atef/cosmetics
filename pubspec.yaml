name: cosmetics
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg:
  flutter_screenutil:
  pin_code_fields:
  vector_graphics: any
  dio:
  pretty_dio_logger:
  shared_preferences:
  shimmer:
  device_preview: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Segoe
      fonts:
        - asset: assets/fonts/segoe/regular.ttf
          weight: 400
        - asset: assets/fonts/segoe/semi_bold.ttf
          weight: 600
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat.ttf
